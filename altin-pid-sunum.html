<style>
:root {
  --bg: #001b4d;
  --bg-deep: #00133a;
  --ink: #002d7a;
  --line: #24509f;
  --line-soft: #123a85;
  --paper: #eef3fb;
  --soft: #9db3db;
  --gold: #9cc2ff;
  --gold-deep: #5f8fe0;

  --berry-lt: #ff9daa;

  --body: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
/* Tema HKTTM logosunun laciverti. Altın yalnızca büyük ödülde (Altın PID) kullanılır. */
.slide.grand, .crown, .cover h1 { --gold: #e0b030; --gold-deep: #b98a12; }
.bar img { height: 46px; width: auto; vertical-align: middle; margin: -14px 14px -12px 0; }
.cover .lg { position: absolute; right: 76px; top: 318px; width: 400px; height: auto; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000a22; overflow: hidden; }
body { font-family: var(--body); color: var(--paper); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body.idle { cursor: none; }
body.blank #stage { visibility: hidden; }

#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1600px; height: 900px; margin: -450px 0 0 -800px;
  transform-origin: 50% 50%;
}
.slide {
  position: absolute; inset: 0; overflow: hidden;

    linear-gradient(90deg, rgba(143, 184, 255, .085) 1px, transparent 1px),
    linear-gradient(rgba(143, 184, 255, .04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(143, 184, 255, .04) 1px, transparent 1px);

  background-position: 0 50px, 0 0, 0 10px, 0 0;
}
/* pafta çerçevesi */
.slide::before {
  content: ""; position: absolute; inset: 18px; border: 2px solid var(--line); pointer-events: none;
}
.slide.grand::before { border-color: var(--gold-deep); }

.bar {
  position: absolute; left: 56px; right: 56px; top: 38px;

}
.bar b { color: var(--gold); font-weight: 400; }
.tb {
  position: absolute; right: 18px; bottom: 18px; height: 40px;
  display: flex; align-items: center; gap: 18px; padding: 0 18px;
  border: 2px solid var(--line); background: var(--bg-deep);

}
.slide.grand .tb { border-color: var(--gold-deep); }
.dots { display: flex; gap: 7px; }

.eyebrow {

  text-transform: uppercase; color: var(--gold);
}
h1, h2 { font-family: var(--head); font-weight: 700; margin: 0; letter-spacing: -.005em; }

.jfig svg { display: block; width: 600px; height: 520px; }
.stamp {
  position: absolute; right: 96px; bottom: 96px; transform: rotate(-7deg);

}
.stamp small { display: block; font-family: var(--mono); font-weight: 400; font-size: 17px; letter-spacing: .2em; }

/* ---------- ara, sertifika, fotoğraf ---------- */
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 120px; }
.center h2 { font-size: 190px; line-height: .92; }

.gains i { font-style: normal; color: var(--line); margin: 0 26px; }

.thanks .txt { position: absolute; left: 76px; top: 150px; width: 730px; }
.thanks h2 { font-size: 104px; line-height: .96; }

.cert {
  position: absolute; left: 880px; top: 170px; width: 640px; height: 500px; transform: rotate(2deg);

.gm { stroke: #0c2f72; stroke-width: 1; }

.tk { font-family: var(--mono); font-size: 26px; fill: var(--soft); }
.al { font-size: 28px; fill: #cfdcf2; letter-spacing: .03em; }

/* ---------- ekranda: adım adım açılış ve çizim ---------- */
@media screen {
  .slide { display: none; }
  .slide.active, .slide.measure { display: block; }
  .slide.measure { visibility: hidden; }

  .cell .inner { opacity: 0; transform: translateY(16px); transition: opacity .45s ease .28s, transform .45s ease .28s; }
  .seal { transition: transform .62s cubic-bezier(.5, 0, .2, 1), opacity .25s ease .4s; }
  .r2 .quote .inner, .r3 .win .inner { opacity: 1; transform: none; }
  .r2 .quote .seal, .r3 .win .seal { transform: perspective(1100px) rotateX(-104deg); opacity: 0; }
  .r2 .dots i:nth-child(2), .r3 .dots i:nth-child(3) { background: var(--gold); border-color: var(--gold); }

  .crown { display: none; }
  .r3 .crown, .slide.measure .crown { display: flex; }
}
@media screen and (prefers-reduced-motion: no-preference) {
  .slide.active .draw { stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.45, 0, .25, 1) .15s forwards; }
  .slide.active .draw.d2 { animation-delay: .5s; }
  .slide.active .draw.d3 { animation-delay: .85s; }
  .slide.active .fade { animation: fade .5s ease .15s both; }
  .slide.active .fade.d2 { animation-delay: .8s; }
  .slide.active .fade.d3 { animation-delay: 1.4s; }
  .r3 .crown { animation: fade .45s ease both; }
  .r3 .crown .rays { animation: rays 1.3s cubic-bezier(.2, .7, .2, 1) both; transform-origin: 800px 420px; }
  .r3 .crown .name { animation: rise .8s cubic-bezier(.2, .7, .2, 1) .35s both; }
  .r3 .crown .eyebrow, .r3 .crown .rule, .r3 .crown .q, .r3 .crown .why, .r3 .crown .k { animation: fade .7s ease .9s both; }
  /* Canlandırma bittikten sonra betik bu sınıfları ekler; son durum sabitlenir */
  .slide.active.cdone .draw, .slide.active.cdone .fade { animation: none; stroke-dashoffset: 0; }
  .slide.sdone .crown, .slide.sdone .crown * { animation: none; }
  .slide.sdone .seal, .slide.sdone .cell .inner { transition: none; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rays { from { opacity: 0; transform: scale(.55) rotate(-8deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.94); } }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

  /* ============ yardımcılar ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function nf(v, d) { return v.toFixed(d).replace(".", ",").replace("-", "−"); }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function sayi(v) { return v === null || v === undefined || v === "" ? "…" : esc(v); }
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    return function () { var u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  }

  /* ============ çizim altyapısı ============ */
  // Yazılar salonun arkasından okunacak boyutta: eksen sayıları 26 px, diğer yazılar 28 px (1600x900 sahnede)
  var W = 860, H = 430, CH = 14; // CH: lejant yerleşiminde varsayılan ortalama harf genişliği
  function lab(v) { return String(v).replace(".", ",").replace("-", "−"); }

  // o: {x,y,w,h, xr:[a,b], yr:[a,b], log, xt:[], yt:[], xl, yl, ylo, xlab:false, ylab:false, xf, yf}
  function axes(o) {
    var lx = !!o.log;
    var x0 = lx ? Math.log10(o.xr[0]) : o.xr[0], x1 = lx ? Math.log10(o.xr[1]) : o.xr[1];
    var a = { x: o.x, y: o.y, w: o.w, h: o.h };
    a.X = function (v) { return o.x + ((lx ? Math.log10(v) : v) - x0) / (x1 - x0) * o.w; };

    s += '<rect class="pl" x="' + o.x + '" y="' + o.y + '" width="' + o.w + '" height="' + o.h + '"/>';

    });

    }

    a.d = function (pts) {

    };
    a.hline = function (v, cls) {

    };
    a.vline = function (v, cls) {

    };
    a.text = function (xv, yv, str, cls, anchor) {

  }
  function swatch(kind, cls, x, yy) {
    if (kind === "dot") return '<circle class="' + cls + '" cx="' + (x + 18) + '" cy="' + (yy - 9) + '" r="5.5"/>';
    if (kind === "band") return '<rect class="' + cls + '" x="' + x + '" y="' + (yy - 20) + '" width="36" height="20"/>';
    return '<line class="tr ' + cls + '" x1="' + x + '" x2="' + (x + 36) + '" y1="' + (yy - 9) + '" y2="' + (yy - 9) + '"/>';
  }

  // İkinci dereceden standart sistemin birim basamak yanıtı (0 < zeta < 1)
  function step2(z, wn, t) {

  }

  /* ============ grafikler ============ */
  // Ortak yerleşim: çizim alanı x = 112..834; tek eksenli grafikte y = 12..358
  var PX = 112, PW = 722;
  var G = {};

  // 1) Bardak = integratör. dh/dt = u - d, u = Kp (r - h). Yudumlar darbe bozucu.
  G.kafein = function () {
    var T = 30, dt = 0.005, Kp = 1.5, r = 100, h = 100, ho = 100, minH = 100;
    var cl = [], ol = [], dd = [], uu = [];
    function d(t) { if (t < 3) return 0; var m = (t - 3) % 5; return m < 0.5 ? 30 : 0; }
    for (var i = 0; i <= T / dt; i++) {
      var t = i * dt, dv = d(t), u = Kp * (r - h);
      if (i % 4 === 0) { cl.push([t, h]); ol.push([t, ho]); dd.push([t, dv]); uu.push([t, u]); }
      h += dt * (u - dv); ho = Math.max(0, ho - dt * dv);
      if (h < minH) minH = h;
    }
    var xt = [0, 10, 20, 30];
    var a = axes({ x: PX, y: 12, w: PW, h: 200, xr: [0, T], yr: [0, 128], xt: xt, yt: [0, 50, 100], xlab: false, yl: "SEVİYE [%]" });
    var b = axes({ x: PX, y: 242, w: PW, h: 116, xr: [0, T], yr: [0, 40], xt: xt, yt: [0, 20, 40], yl: "AKIŞ", xl: "ZAMAN [dk]", ylo: 66 });
    var s = a.base + b.base +
      a.hline(100, "c-paper thin dash") + a.text(29.6, 107, "r = dolu bardak", "an", "end") +
      a.path(ol, "c-berry dash", "fade d2") + a.path(cl, "c-gold thick") +
      legend(a.X(0.7), a.Y(31), [["line", "c-gold thick", "kapalı çevrim"], ["line", "c-berry dash", "açık çevrim: bardak boşalır"]]) +
      b.path(dd, "c-berry") + b.path(uu, "c-gold", "draw d2") +
      legend(PX, 422, [["line", "c-berry", "d: yudum"]]) + legend(PX + PW - 46 - 9 * CH, 422, [["line", "c-gold", "u: demlik"]]);
    return {
      cap: "Bardak seviyesi, kapalı çevrim",
      svg: svg(s, "Bardak seviyesinin zamanla değişimi: kapalı çevrimde her yudumdan sonra seviye referansa döner, açık çevrimde bardak boşalır"),
      note: "dh/dt = u − d · u = Kp(r − h) · en düşük seviye %" + nf(minH, 1)
    };
  };

  // 2) |G(jw)| = 1 / sqrt((1 - r^2)^2 + (2 zeta r)^2), r = w / wn
  G.rezonans = function () {
    var a = axes({ x: PX, y: 12, w: PW, h: 346, xr: [0, 2.5], yr: [0, 6], xt: [0, 0.5, 1, 1.5, 2, 2.5], yt: [0, 1, 2, 3, 4, 5, 6], xl: "FREKANS ORANI  ω / ωn", yl: "GENLİK ORANI  |G(jω)|", ylo: 52 });
    function mag(z, r) { return 1 / Math.sqrt(Math.pow(1 - r * r, 2) + Math.pow(2 * z * r, 2)); }
    function curve(z) { var p = []; for (var i = 0; i <= 500; i++) { var r = i / 200; p.push([r, mag(z, r)]); } return p; }
    var zs = [[1.0, "c-soft dot2", "fade"], [0.7, "c-soft", "draw"], [0.4, "c-paper", "draw"], [0.2, "c-berry", "draw d2"], [0.1, "c-gold thick", "draw d3"]];
    var s = a.base + a.vline(1, "c-soft thin dash") + a.text(1.03, 5.62, "ω = ωn", "lgd f-soft");
    zs.forEach(function (c) { s += a.path(curve(c[0]), c[1], c[2]); });
    var z = 0.1, rp = Math.sqrt(1 - 2 * z * z), mp = 1 / (2 * z * Math.sqrt(1 - z * z));

    s += legend(a.X(1.78), a.Y(3.55), [["line", "c-gold thick", "ζ = 0,1"], ["line", "c-berry", "ζ = 0,2"], ["line", "c-paper", "ζ = 0,4"], ["line", "c-soft", "ζ = 0,7"], ["line", "c-soft dot2", "ζ = 1,0"]]);
    return {
      cap: "Genlik–frekans yanıtı",
      svg: svg(s, "İkinci dereceden sistemin genlik oranı: sönüm azaldıkça doğal frekansta tepe büyür"),
      note: "G(s) = ωn² / (s² + 2ζωn·s + ωn²) · ζ = 0,1 için tepe " + nf(mp, 2)

  };

  // 3) Birinci derece + ölü zaman: veriden en küçük kareler uydurma (K kapalı biçim, tau ve L ızgara araması)
  G.tanilama = function () {
    var Ts = 0.2, N = 81, sub = 10, dt = Ts / sub, g = gauss(rng(11));
    function uAt(t) { return t < 1 ? 0 : t < 7 ? 1 : t < 11 ? 0.4 : 0.9; }
    function sim(tau, L) {
      var y = 0, out = [];
      for (var k = 0; k < N; k++) { out.push(y); for (var j = 0; j < sub; j++) y += dt * (uAt(k * Ts + j * dt - L) - y) / tau; }
      return out;
    }
    var tr = sim(1.2, 0.6), y = [], k, mean = 0;
    for (k = 0; k < N; k++) { y.push(2 * tr[k] + 0.12 * g()); mean += y[k] / N; }
    var best = { sse: Infinity };
    function tara(L0, L1, t0, t1, adim) {
      for (var L = Math.max(0, L0); L <= L1 + 1e-9; L += adim) {
        for (var tau = Math.max(0.2, t0); tau <= t1 + 1e-9; tau += adim) {
          var m = sim(tau, L), sym = 0, smm = 0, sse = 0;
          for (k = 0; k < N; k++) { sym += y[k] * m[k]; smm += m[k] * m[k]; }
          var K = sym / smm;
          for (k = 0; k < N; k++) sse += Math.pow(y[k] - K * m[k], 2);
          if (sse < best.sse) best = { sse: sse, K: K, tau: tau, L: L, m: m };
        }
      }
    }
    tara(0, 1.5, 0.4, 3, 0.1);                                             // kaba ızgara
    tara(best.L - 0.1, best.L + 0.1, best.tau - 0.1, best.tau + 0.1, 0.01); // ince ızgara
    var sst = 0; for (k = 0; k < N; k++) sst += Math.pow(y[k] - mean, 2);
    var fit = 100 * (1 - Math.sqrt(best.sse / sst));
    var xt = [0, 4, 8, 12, 16];
    var a = axes({ x: PX, y: 12, w: PW, h: 206, xr: [0, 16], yr: [-0.75, 2.6], xt: xt, yt: [0, 1, 2], xlab: false, yl: "ÇIKIŞ  y", ylo: 52 });
    var b = axes({ x: PX, y: 248, w: PW, h: 110, xr: [0, 16], yr: [-0.15, 1.3], xt: xt, yt: [0, 1], yl: "GİRİŞ  u", xl: "ZAMAN [s]", ylo: 52 });
    var pts = "", mod = [], inp = [];
    for (k = 0; k < N; k++) {
      pts += '<circle class="pt" cx="' + a.X(k * Ts).toFixed(1) + '" cy="' + a.Y(y[k]).toFixed(1) + '" r="3.6"/>';
      mod.push([k * Ts, best.K * best.m[k]]);
    }
    for (var t = 0; t <= 16.001; t += 0.01) inp.push([t, uAt(t)]);
    var s = a.base + b.base + '<g class="fade">' + pts + "</g>" + a.path(mod, "c-gold thick", "draw d2") +
      legend(a.X(8.6), a.Y(0.12), [["dot", "pt", "ölçülen çıkış"], ["line", "c-gold thick", "uydurulan model"]]) +
      b.path(inp, "c-paper") + b.text(1.35, 0.36, "uyarı sinyali", "lgd f-soft");
    return {
      cap: "Kara kutu: veri ve uydurulan model",
      svg: svg(s, "Kara kutunun giriş ve gürültülü çıkış verisi ile en küçük kareler yöntemiyle uydurulan birinci derece ölü zamanlı model"),
      note: "K·e^(−Ls)/(τs+1) · K = " + nf(best.K, 2) + " · τ = " + nf(best.tau, 2) + " s · L = " + nf(best.L, 2) + " s · uyum %" + nf(fit, 0)
    };
  };

  // 4) Sabit hız modelli Kalman filtresi: durum [konum, hız], ölçüm = konum + gürültü
  G.kalman = function () {
    var dt = 0.2, N = 101, sig = 0.7, R = sig * sig, sa = 0.3, g = gauss(rng(5));
    var q = sa * sa, Q = [[q * Math.pow(dt, 4) / 4, q * Math.pow(dt, 3) / 2], [q * Math.pow(dt, 3) / 2, q * dt * dt]];
    var x = [0, 0], P = [[9, 0], [0, 9]];
    var tru = [], est = [], up = [], lo = [], dots = "", em = 0, ee = 0, n = 0;
    var a = axes({ x: PX, y: 12, w: PW, h: 346, xr: [0, 20], yr: [-2, 9.6], xt: [0, 5, 10, 15, 20], yt: [-2, 0, 2, 4, 6, 8], xl: "ZAMAN [s]", yl: "KONUM", ylo: 66 });
    for (var k = 0; k < N; k++) {
      var t = k * dt, xt = 2 + 1.5 * Math.sin(0.45 * t) + 0.12 * t, z = xt + sig * g();
      if (k > 0) { // öngörü
        x = [x[0] + dt * x[1], x[1]];
        var p00 = P[0][0] + dt * (P[1][0] + P[0][1]) + dt * dt * P[1][1] + Q[0][0];
        var p01 = P[0][1] + dt * P[1][1] + Q[0][1];
        var p11 = P[1][1] + Q[1][1];
        P = [[p00, p01], [p01, p11]];
      }
      var S = P[0][0] + R, K0 = P[0][0] / S, K1 = P[1][0] / S, inn = z - x[0]; // güncelleme
      x = [x[0] + K0 * inn, x[1] + K1 * inn];
      P = [[(1 - K0) * P[0][0], (1 - K0) * P[0][1]], [P[1][0] - K1 * P[0][0], P[1][1] - K1 * P[0][1]]];
      var sd = 2 * Math.sqrt(P[0][0]);
      tru.push([t, xt]); est.push([t, x[0]]); up.push([t, x[0] + sd]); lo.push([t, x[0] - sd]);

      if (k >= 10) { em += (z - xt) * (z - xt); ee += (x[0] - xt) * (x[0] - xt); n++; }
    }
    var s = a.base + '<path class="band fade d2" d="' + a.d(up.concat(lo.reverse())) + 'Z"/>' +
      '<g class="fade">' + dots + "</g>" +
      a.path(tru, "c-paper thin dash", "fade") + a.path(est, "c-gold thick", "draw d2") +
      legend(a.X(0.5), a.Y(8.75), [["dot", "pt", "ölçüm"], ["line", "c-paper thin dash", "gerçek sinyal"]]) +
      legend(a.X(7.2), a.Y(8.75), [["line", "c-gold thick", "Kalman kestirimi"], ["band", "band", "±2σ bandı"]]);
    return {
      cap: "Gürültülü ölçüm ve Kalman kestirimi",
      svg: svg(s, "Gürültülü ölçüm noktaları, gerçek sinyal, Kalman kestirimi ve zamanla daralan iki sigma belirsizlik bandı"),
      note: "Sabit hız modeli · σ = 0,7 · RMS hata: " + nf(Math.sqrt(em / n), 2) + " → " + nf(Math.sqrt(ee / n), 2)
    };
  };

  // 5) P(s) = 1/(s+1), C(s) = 9 + 25/s. Tesis girişinde basamak bozucu: Y/D = s / (s+5)^2
  G.bozucu = function () {
    var t0 = 2, xt = [0, 2, 4, 6, 8, 10];
    var a = axes({ x: PX, y: 12, w: PW, h: 96, xr: [0, 10], yr: [-0.2, 1.5], xt: xt, yt: [0, 1], xlab: false, yl: "d(t)", ylo: 52 });
    var b = axes({ x: PX, y: 138, w: PW, h: 220, xr: [0, 10], yr: [-0.2, 1.2], xt: xt, yt: [0, 0.5, 1], xl: "ZAMAN [s]", yl: "SAPMA  y − r" });

      b.path(ol, "c-berry dash", "fade d2") + b.text(4.7, 0.66, "açık çevrim: sapma kalıcı", "an f-berry") +
      b.path(cl, "c-gold thick", "draw d2") +
      '<g class="fade d3">' + b.dot(t0 + 0.2, pk, "f-gold", 6) + b.text(3.0, 0.16, "kapalı çevrim: tepe " + nf(pk, 3), "an f-gold") + "</g>";

      cap: "Tesis girişinde basamak bozucu",

      note: "P = 1/(s+1) · C = 9 + 25/s · Y/D = s/(s+5)² · tepe: bozucunun %" + nf(pk * 100, 1) + "'i"
    };
  };

  // 6) Boşluk (backlash) operatörü: |giriş - çıkış| <= b iken çıkış yerinde kalır
  G.bosluk = function () {
    var bq = 20, A = 100, out = 0, loop = [], ideal = [[-A, -A], [A, A]];
    for (var i = 0; i <= 1500; i++) {
      var th = i / 1500 * 2.25 * 2 * Math.PI, inp = A * Math.sin(th);
      if (inp - out > bq) out = inp - bq; else if (inp - out < -bq) out = inp + bq;
      loop.push([inp, out]);
    }
    var tk = [-100, 0, 100];
    var o = { y: 46, w: 340, h: 312, xr: [-128, 128], yr: [-128, 128], xt: tk, yt: tk, xl: "GİRİŞ [µm]" };
    var a = axes(Object.assign({ x: PX, yl: "ÇIKIŞ [µm]", ylo: 94 }, o));

    }
    var yy = a.Y(0), xa = a.X(-bq), xb = a.X(bq);
    var dim = '<g class="fade d3"><line class="tr c-paper thin" x1="' + xa + '" x2="' + xb + '" y1="' + yy + '" y2="' + yy + '"/>' +
      '<path class="f-paper" d="M' + xa + " " + yy + "l10 -6v12Z M" + xb + " " + yy + 'l-10 -6v12Z"/>' +
      '<line class="tr c-paper thin" x1="' + ((xa + xb) / 2) + '" x2="' + a.X(46) + '" y1="' + yy + '" y2="' + a.Y(-76) + '"/>' +
      a.text(120, -104, "2b = 40 µm", "an", "end") + "</g>";
    var s = '<text class="al f-berry" x="' + PX + '" y="30">BOŞLUKLU</text><text class="al f-gold" x="' + (PX + 382) + '" y="30">SIFIR BOŞLUK</text>' +
      a.base + b.base +
      '<path class="tr c-soft thin dot2" d="' + a.d(ideal) + '"/>' + a.path(loop, "c-berry") +

  // 9) L(s) = 2 / (3 s (s+1)): faz marjı tam 60 derece, faz -180'i kesmediği için kazanç marjı sonsuz

    function ph(w) { return -90 - Math.atan(w) * 180 / Math.PI; }
    var lo = 0.01, hi = 100;
    for (var it = 0; it < 80; it++) { var mid = Math.sqrt(lo * hi); if (mag(mid) > 1) lo = mid; else hi = mid; }

    var a = axes({ x: bx, y: 12, w: bw, h: 160, log: true, xr: [0.01, 100], yr: [-90, 50], xt: xt, yt: [-80, -40, 0, 40], xlab: false, yl: "GENLİK [dB]", ylo: 96 });
    var b = axes({ x: bx, y: 202, w: bw, h: 156, log: true, xr: [0.01, 100], yr: [-195, -75], xt: xt, yt: [-180, -150, -120, -90], xl: "FREKANS  ω [rad/s]", yl: "FAZ [°]", ylo: 96 });
    var pm_ = [], pp = [], as = [];

  // 10) G(s) = 8 / ((s+1)(s+2)(s+4)). Aynı Kp ile P, PI ve PID; türev ölçümden alınır
  G.pid = function () {
    var T = 10, dt = 0.001;
    function sim(Kp, Ki, Kd) {
      var x = [0, 0, 0], I = 0, o = { y: [], P: [], I: [], D: [], u: [], peak: 0, ts: 0, fin: 0 };
      for (var i = 0; i <= T / dt; i++) {
        var t = i * dt, y = x[2], e = 1 - y, dy = 4 * (x[1] - x[2]);

        if (y > o.peak) o.peak = y;
        if (Math.abs(y - 1) > 0.02) o.ts = t;
        o.fin = y;
        x[0] += dt * (-x[0] + u); x[1] += dt * 2 * (x[0] - x[1]); x[2] += dt * 4 * (x[1] - x[2]); I += dt * Ki * e;
      }
      return o;
    }

      a.path(p.y, "c-soft dash", "fade") + a.path(pi.y, "c-berry", "draw") + a.path(pid.y, "c-gold thick", "draw d2") +
      legend(a.X(3.6), a.Y(0.5), [
        ["line", "c-soft dash", "yalnız P: kalıcı hata %" + nf((1 - p.fin) * 100, 0)],
        ["line", "c-berry", "PI: aşım %" + nf((pi.peak - 1) * 100, 0)],
        ["line", "c-gold thick", "PID: aşım %" + nf((pid.peak - 1) * 100, 0) + ", yerleşme " + nf(pid.ts, 1) + " s"]
      ], 32) +

      b.path(pid.P, "c-paper thin", "draw d2") + b.path(pid.I, "c-berry thin", "draw d2") + b.path(pid.D, "c-mint thin", "draw d2") + b.path(pid.u, "c-gold", "draw d3") +
      legendRow(b.X(3.6), b.Y(2.3), [["line", "c-paper thin", "P"], ["line", "c-berry thin", "I"], ["line", "c-mint thin", "D"], ["line", "c-gold", "u = P+I+D"]]);
    return {
      cap: "P → PI → PID: ayar ve yanıt",
      svg: svg(s, "Üstte yalnız P, PI ve PID kontrolcülerin basamak yanıtları; altta PID kontrol işaretinin P, I ve D bileşenleri"),
      note: "G(s) = 8/((s+1)(s+2)(s+4)) · Kp = 3 · Ki = 1,3 · Kd = 0,8"
    };
  };

  add("thanks", 1,
    bar("<b>Toplam kazanç</b> · Herkese sertifika") +
    '<div class="txt"><p class="eyebrow">Çıkış doygunluğu yok</p><h2>Kimse eli boş dönmüyor.</h2>' +
    '<p class="lead">Herkese, kendine özel bir kategoriyle sertifika var.</p>' +
    '<p class="lead">Aday gösteren, oy veren ve alkışlayan herkese teşekkürler.</p></div>' +
    '<div class="cert"><div><p>' + esc(A.bolumAdi) + '</p><div class="t">Altın PID ' + yil + '</div><p class="c">Kişiye özel kategori</p>' +
    '<div class="n">Ad Soyad</div><p>Yıl boyunca çevrimi kapalı tuttuğu için.</p><p class="s">Jüri adına: Σ &nbsp; Kp &nbsp; Ki &nbsp; Kd</p></div></div>');

  // toplu fotoğraf
  add("photo", 1,
    bar("<b>Son örnekleme</b> · Tek kare") +
    '<div class="vf"><i></i><i></i><i></i><i></i></div>' +
    '<div class="center"><p class="eyebrow">Ekranlar kapalı · gülümseyin</p><h2>Toplu fotoğraf</h2>' +
    '<p class="lead">Sertifikalar elde, herkes kadraja.</p>' +
    '<p class="wish"><b>Mutlu yıllar.</b> ' + (Number(A.yil) + 1 || "") + "'de aşımınız az, kazancınız bol, sisteminiz kararlı olsun.</p></div>");

  total = html.length;
  var stage = document.getElementById("stage");
  stage.innerHTML = html.join("").replace(/PAFTA (\d+) \/ \d+/g, function (m, n) { return "PAFTA " + n + " / " + two(total); });
  document.title = "Altın PID " + A.yil + " sunumu";
  var slides = Array.prototype.slice.call(stage.children);

  /* ============ metin sığdırma (uzun adlar ve başlıklar) ============ */
  slides.forEach(function (sl) {
    sl.classList.add("measure");
    Array.prototype.forEach.call(sl.querySelectorAll("[data-fit]"), function (el) {
      var fs = +el.getAttribute("data-fit"), min = +el.getAttribute("data-min");
      el.style.fontSize = fs + "px";
      while (el.scrollWidth > el.clientWidth && fs > min) { fs -= 2; el.style.fontSize = fs + "px"; }
      if (el.scrollWidth > el.clientWidth) el.classList.add("wrap");
    });
    // kazanan kutusu: ad ve gerekçe birlikte kutuya sığana kadar küçült
    var inner = sl.querySelector(".win .inner");
    if (inner) {
      var nm = inner.querySelector(".name"), why = inner.querySelector(".why");
      var a1 = parseFloat(nm.style.fontSize) || 92, a2 = 32;
      while (inner.scrollHeight > inner.clientHeight && (a1 > 34 || a2 > 26)) {
        if (a1 > 34) { a1 -= 2; nm.style.fontSize = a1 + "px"; }
        if (why && a2 > 26) { a2 -= 1; why.style.fontSize = a2 + "px"; }
      }
    }
    var left = sl.querySelector(".left");
    if (left) {
      var h2 = left.querySelector("h2"), who = left.querySelector(".who"), f = 84, f2 = 37;
      while (left.scrollHeight > left.clientHeight && f > 52) { f -= 4; h2.style.fontSize = f + "px"; }
      while (left.scrollHeight > left.clientHeight && f2 > 32) { f2 -= 1; who.style.fontSize = f2 + "px"; }
    }
    sl.classList.remove("measure");
  });

  /* ============ gezinme ============ */
  var cur = 0, st = 1, shown = -1, tChart, tStep;
  function show(push) {
    var fresh = shown !== cur, target = slides[cur];
    slides.forEach(function (sl, i) {
      var on = i === cur;
      sl.classList.toggle("active", on);
      sl.classList.toggle("r2", on && st >= 2);
      sl.classList.toggle("r3", on && st >= 3);
      sl.classList.remove("sdone");
      if (fresh) sl.classList.remove("cdone");
    });
    // Canlandırmalar bitince son durumu sabitle (yedek: saat ilerlemese de grafik eksik kalmaz)
    clearTimeout(tStep);
    tStep = setTimeout(function () { target.classList.add("sdone"); }, 1900);
    if (fresh) {
      clearTimeout(tChart);
      tChart = setTimeout(function () { target.classList.add("cdone"); }, 2400);
    }
    shown = cur;
    if (push !== false) {
      var h = "#" + (cur + 1) + (st > 1 ? "." + st : "");
      try { history.replaceState(null, "", h); } catch (e) { location.hash = h; }
    }
  }
  function go(i, s) {
    cur = Math.max(0, Math.min(total - 1, i));
    st = Math.max(1, Math.min(steps[cur], s || 1));
    show();
  }
  function next() { if (st < steps[cur]) go(cur, st + 1); else if (cur < total - 1) go(cur + 1, 1); }
  function prev() { if (st > 1) go(cur, st - 1); else if (cur > 0) go(cur - 1, steps[cur - 1]); }
  function fromHash() {
    var m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash);
    if (m) { cur = Math.max(0, Math.min(total - 1, +m[1] - 1)); st = Math.max(1, Math.min(steps[cur], +(m[2] || 1))); }
    show(false);
  }
  function fullscreen() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
  }
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === " " || k === "Spacebar" || k === "PageDown" || k === "Enter") next();
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace") prev();
    else if (k === "Home") go(0, 1);
    else if (k === "End") go(total - 1, 1);
    else if (k === "f" || k === "F") fullscreen();
    else if (k === "b" || k === "B" || k === ".") document.body.classList.toggle("blank");
    else return;
    e.preventDefault();
  });
  document.addEventListener("click", function (e) { if (e.button === 0) next(); });
  window.addEventListener("hashchange", fromHash);

  function fit() {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  var idle;
  document.addEventListener("mousemove", function () {
    document.body.classList.remove("idle");
    clearTimeout(idle);
    idle = setTimeout(function () { document.body.classList.add("idle"); }, 2500);
  });

  fit();
  fromHash();
})();
</script>
</body>
</html>
